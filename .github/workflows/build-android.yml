name: Build Android UE Dumper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Android NDK r29
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r29" >> $GITHUB_ENV
          # 直接链接真实二进制，不是外层壳脚本
          sudo ln -s $PWD/android-ndk-r29/build/ndk-build /ndk-build

      - name: Compile project
        run: |
          ls -la
          cd ./AndUEDumper
          ls -la
          make clean && make
          ls -la out/

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binary
          path: "**/out/*"
