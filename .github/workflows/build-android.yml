name: Build Android UE Dumper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Android NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r25c" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r25c" >> $GITHUB_PATH

      - name: Compile project
        run: |
          cd ./AndUEDumper
          make clean && make
          # 检查实际产物目录（现在是 libs/ 不是 out/）
          ls -la libs/

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binary
          # 修改为实际产物路径，匹配 Makefile 的默认输出
          path: "**/libs/**/*"
